<!DOCTYPE html>
<!--
  Kurious has one light, paper-first theme (tokens in src/styles.css).
-->
<html lang="en" data-theme="kurious">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF8EC" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Kurious</title>
    <!--
      First-paint background: mirrors --color-paper in src/styles.css so the
      pre-CSS frame is already warm paper (no white or dark flash).
    -->
    <style>
      html { background-color: #FFF8EC; color-scheme: light; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
